services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: accessguard_db
    environment:
      POSTGRES_DB: accessguard_db
      POSTGRES_USER: accessguard
      POSTGRES_PASSWORD: accessguard_secret_db_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessguard -d accessguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: accessguard_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://accessguard:accessguard_secret_db_pass@db:5432/accessguard_db
      - SECRET_KEY=accessguard-production-super-secret-key-32bytesmin
      - CV_ADAPTER=heuristic
      - ENABLE_PRIVACY_BLURRING=true
      - STRIP_EXIF_AFTER_EXTRACTION=true
    ports:
      - "8000:8000"
    volumes:
      - media_uploads:/app/data/uploads
      - media_processed:/app/data/processed
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: accessguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_uploads:
  media_processed:
