name: AccessGuard CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & CV Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (OpenCV & Geospatial)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgeos-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          export PYTHONPATH=backend
          export ACCESSGUARD_OFFLINE_DATASETS=1
          python -m pytest backend/tests -v

      - name: Run CV Model Evaluation Framework
        run: |
          export PYTHONPATH=backend
          python backend/app/cv/evaluation/run_eval.py

  frontend-test:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck & Production Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
